name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  release:
    if: github.event.created == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Package Firefox extension and sources
        run: pnpm zip

      - name: Package Chrome extension
        run: pnpm zip:chrome

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes "Includes unsigned Firefox and Chrome packages, plus the Firefox source archive. See the README for installation instructions." \
            .output/*-firefox.zip \
            .output/*-chrome.zip \
            .output/*-sources.zip
